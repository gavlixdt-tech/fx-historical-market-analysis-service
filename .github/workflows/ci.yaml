# Continuous integration for fx-historical-market-analysis-service.
#
# Every check runs on a clean checkout with pinned dependency versions. A
# failing check fails the job - no check is allowed to silently pass.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend tests, lint and types
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gfx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gfx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/gfx_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check app tests > backend-lint.log 2>&1 || { cat backend-lint.log; exit 1; }

      - name: Upload backend lint diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-lint-diagnostics
          path: backend-lint.log
          if-no-files-found: ignore

      - name: Lint (ruff format --check)
        run: ruff format --check app tests

      - name: Type check (mypy)
        run: mypy app

      - name: Unit and integration tests
        run: pytest tests -q
      - name: Restart PostgreSQL and verify evidence ledger durability
        shell: bash
        run: |
          container_id="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "postgres:17" { print $1; exit }')"
          test -n "$container_id"
          snapshot_database() {
            python - <<'PY'
          import hashlib
          import os
          import psycopg

          with psycopg.connect(os.environ["TEST_POSTGRES_URL"]) as db:
              snapshot = [
                  db.execute(
                      "SELECT event_id,topic,envelope_json,payload_sha256,key_id,available_at,instrument,"
                      "timeframe,signature_verified,source_verified,received_at,available_at_epoch_us,"
                      "received_at_epoch_us,lifecycle_id,transition_sequence,transition_sha256,source_dataset_id "
                      "FROM lifecycle_evidence_inbox ORDER BY event_id"
                  ).fetchall(),
                  db.execute(
                      "SELECT event_id,source_dataset_id,payload_sha256,verified_at "
                      "FROM lifecycle_evidence_source_verifications ORDER BY event_id"
                  ).fetchall(),
                  db.execute(
                      "SELECT conflict_id,event_id,payload_sha256,envelope_json,received_at "
                      "FROM lifecycle_evidence_conflicts ORDER BY conflict_id"
                  ).fetchall(),
                  db.execute(
                      "SELECT delivery_id,event_id,envelope_json,rejection_reason,received_at "
                      "FROM lifecycle_evidence_quarantine ORDER BY delivery_id"
                  ).fetchall(),
              ]
          print(hashlib.sha256(repr(snapshot).encode("utf-8")).hexdigest())
          PY
          }
          before="$(snapshot_database)"
          docker restart "$container_id"
          for attempt in $(seq 1 30); do
            if python -c 'import os, psycopg; db=psycopg.connect(os.environ["TEST_POSTGRES_URL"], connect_timeout=2); db.close()' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          after="$(snapshot_database)"
          test "$before" = "$after"

      - name: Verify the OpenAPI schema can be generated
        run: PYTHONPATH=.. python -c "from backend.app.main import app; app.openapi()"

      - name: Verify no credentials are committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::A .env file is committed. Remove it."
            exit 1
          fi
          if git grep -nE '(api[_-]?key|secret|password)\s*[:=]\s*["'"'"'][A-Za-z0-9/+_-]{16,}' \
               -- backend frontend ':!*.example' ':!*.md' ':!backend/tests' ; then
            echo "::error::A possible hard-coded credential was found."
            exit 1
          fi
          echo "No committed credentials detected."

  frontend:
    name: Frontend tests, type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Verify the build output exists
        run: test -f dist/index.html

  containers:
    name: Container build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: fx-historical-market-analysis-service-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: fx-historical-market-analysis-service-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the backend container
        run: |
          docker run -d --name hma-backend -p 8000:8000 \
            fx-historical-market-analysis-service-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/live >/dev/null; then
              echo "Backend container is live."
              curl -fsS http://127.0.0.1:8000/api/v1/version
              docker rm -f hma-backend
              exit 0
            fi
            sleep 2
          done
          echo "::error::The backend container did not become live."
          docker logs hma-backend || true
          docker rm -f hma-backend || true
          exit 1

  security:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and audit Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -e ".[dev]" pip-audit
          pip-audit --local --skip-editable

      - name: Audit production npm dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

      - name: Audit full npm tree with narrow upstream advisory exception
        working-directory: frontend
        run: node scripts/check-npm-audit.mjs
