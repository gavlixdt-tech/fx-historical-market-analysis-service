# Continuous integration for fx-historical-market-analysis-service.
#
# Every check runs on a clean checkout with pinned dependency versions. A
# failing check fails the job - no check is allowed to silently pass.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend tests, lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check app tests

      - name: Lint (ruff format --check)
        run: ruff format --check app tests

      - name: Type check (mypy)
        run: mypy app

      - name: Unit and integration tests
        run: pytest tests -q

      - name: Verify the OpenAPI schema can be generated
        run: python -c "from backend.app.main import create_app; create_app().openapi()"

      - name: Verify no credentials are committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::A .env file is committed. Remove it."
            exit 1
          fi
          if git grep -nE '(api[_-]?key|secret|password)\s*[:=]\s*["'"'"'][A-Za-z0-9/+_-]{16,}' \
               -- backend frontend ':!*.example' ':!*.md' ':!backend/tests' ; then
            echo "::error::A possible hard-coded credential was found."
            exit 1
          fi
          echo "No committed credentials detected."

  frontend:
    name: Frontend tests, type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Verify the build output exists
        run: test -f dist/index.html

  containers:
    name: Container build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: fx-historical-market-analysis-service-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: fx-historical-market-analysis-service-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the backend container
        run: |
          docker run -d --name hma-backend -p 8000:8000 \
            fx-historical-market-analysis-service-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/live >/dev/null; then
              echo "Backend container is live."
              curl -fsS http://127.0.0.1:8000/api/v1/version
              docker rm -f hma-backend
              exit 0
            fi
            sleep 2
          done
          echo "::error::The backend container did not become live."
          docker logs hma-backend || true
          docker rm -f hma-backend || true
          exit 1

  security:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r backend/pyproject.toml || true

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || true
