name: Format backend source

on:
  push:
    branches: [master]
    paths:
      - backend/app/analysis/model_research.py
      - backend/app/analysis/seasonality.py
      - backend/app/schemas/analysis.py
      - backend/app/services/analysis_service.py
      - backend/app/services/forecasting_service.py
      - backend/tests/integration/test_analysis_api.py
      - backend/tests/integration/test_forecasting_contract_phase.py
      - backend/tests/unit/test_model_research_calibration.py
      - backend/tests/unit/test_seasonality.py
      - .github/workflows/format-backend.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project tooling
        run: python -m pip install -e ".[dev]"

      - name: Format backend files
        run: ruff format app tests

      - name: Commit formatted files directly to master
        working-directory: .
        run: |
          if git diff --quiet -- backend/app backend/tests; then
            echo "Backend source is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app backend/tests
          git commit -m "style(backend): apply Ruff formatting"
          git push origin HEAD:master
