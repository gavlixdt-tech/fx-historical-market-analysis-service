name: Refresh frontend dependency lockfile

on:
  push:
    branches: [master]
    paths:
      - frontend/package.json
      - .github/workflows/refresh-frontend-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve and write lockfile
        working-directory: frontend
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit refreshed lockfile directly to master
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Frontend lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(deps): refresh frontend dependency lockfile"
          git push origin HEAD:master
