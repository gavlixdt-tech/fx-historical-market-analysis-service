[project]
name = "fx-historical-market-analysis-service"
version = "0.1.0"
description = "Forex AI Platform - Historical Market Analysis Service foundation (research/simulation only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<0.116.0",
    "uvicorn>=0.30.0,<0.33.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "httpx>=0.26.0,<0.28.0",
    "python-json-logger>=2.0.0,<3.0.0",
    "starlette>=0.36.0,<0.47.0",
    # Observability
    "opentelemetry-api>=1.28.0,<2.0.0",
    "opentelemetry-sdk>=1.28.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<0.50",
    # Metrics
    "prometheus-client>=0.21.0,<0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.25.0",
    "httpx>=0.26.0,<0.28.0",
    "ruff>=0.6.0,<0.9.0",
    "mypy>=1.8.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.25.0",
    "httpx>=0.26.0,<0.28.0",
    "ruff>=0.6.0,<0.9.0",
    "mypy>=1.8.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "N", "D", "S"]
ignore = ["E501", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D203", "D205", "D212", "D213", "D401", "D402", "D403", "D404", "D406", "D407", "D408", "D409", "D413", "D415", "D416", "D417", "B008"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "S105", "S106", "S107"]
"**/tests/**" = ["S101", "S105", "S106", "S107"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-v", "--strict-markers"]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
]
